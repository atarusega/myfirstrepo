<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>История дизайна — музейная карточка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EA; --paper2:#EAE6DC; --ink:#1C1C1C; --ink2:#5B5952; --rule:#CFC9BB;
  --blue:#3A3ED8; --orange:#F2642A; --mint:#9FE3D4; --lilac:#D9BDF2; --yellow:#F2B31A;
  --label:190px; --mono:'IBM Plex Mono',monospace; --head:'Unbounded',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--mono)}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}

/* шапка */
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:28px 32px 20px;border-bottom:1px solid var(--ink)}
h1{font:800 44px/0.95 var(--head);margin:0;letter-spacing:-.02em;text-transform:uppercase}
h1 small{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.08em;margin-top:12px;color:var(--ink2);text-transform:uppercase}
.stats{display:flex;gap:28px}
.stat b{display:block;font:600 28px/1 var(--head);color:var(--blue)}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
nav{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);padding:8px 32px;display:flex;flex-direction:column;gap:6px}
nav .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav .nl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin-right:4px}
.tg,.zm{border:1px solid var(--ink);background:var(--paper);padding:3px 10px;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.tg i{width:9px;height:9px;display:inline-block;border:1px solid var(--ink)}
.tg.off{border-color:var(--rule);color:var(--ink2);text-decoration:line-through}
.tg.off i{background:transparent!important;border-color:var(--rule)}
.tg.all{border-style:dashed}
.zm.on{background:var(--ink);color:var(--paper)}
.tg:hover,.zm:hover{border-color:var(--blue);color:var(--blue)}

/* таймлайн */
#tl{position:relative;overflow:auto;height:calc(100vh - 78px);scrollbar-color:var(--ink) var(--paper2);cursor:grab}
#tl.drag{cursor:grabbing;user-select:none}
#canvas{position:relative}
.ruler{position:sticky;top:0;height:30px;border-bottom:1px solid var(--ink);background:var(--paper);z-index:8}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--ink);font-size:11px;padding:6px 0 0 5px}
.tick.minor{border-color:var(--rule);color:transparent}
.grid{position:absolute;top:30px;bottom:0;border-left:1px dashed var(--rule);pointer-events:none}
.lane{position:relative;border-bottom:1px solid var(--ink)}
.lane .body{position:absolute;left:0;right:0;bottom:0}
.lab{position:sticky;left:12px;top:36px;z-index:6;display:inline-flex;align-items:baseline;gap:8px;margin:8px 0 0 12px;padding:6px 10px;background:var(--paper);border:1px solid var(--ink);box-shadow:3px 3px 0 var(--paper2);max-width:calc(100vw - 40px);white-space:nowrap}
.lab b{font:600 13px/1 var(--head)}
.lab i{display:inline-block;width:10px;height:10px;align-self:center}
.lab em{font-style:normal;font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.lab button{border:0;background:none;font-size:10px;color:var(--ink2);text-decoration:underline;padding:0 0 0 6px}
.lab button:hover{color:var(--orange)}
.band{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.band.s{background:rgba(58,62,216,.04)}
.band span{position:sticky;left:16px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);display:inline-block;padding:2px 0 0}

/* маятник */
.axis{position:absolute;left:0;right:0;border-top:1px solid var(--ink)}
.axis-lab{position:absolute;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.mv{position:absolute;z-index:2;height:26px;display:flex;align-items:center;padding:0 8px;font:600 11px/1 var(--head);white-space:nowrap;overflow:hidden;cursor:pointer;border:1px solid var(--ink);background:var(--paper)}
.mv.simple{background:var(--blue);border-color:var(--blue);color:#fff}
.mv.mid{background:var(--paper2)}
.mv:hover,.it:hover .th,.chip:hover{outline:2px solid var(--orange);outline-offset:1px}
.mv.open-end{border-right:1px dashed}
svg.pend{position:absolute;left:0;top:0;pointer-events:none}

/* предметы */
.it{position:absolute;cursor:pointer;width:64px}
.th{width:64px;height:64px;background:var(--paper2);position:relative;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;filter:url(#duo);display:block}
.th.none{background:repeating-linear-gradient(45deg,var(--paper2) 0 6px,var(--paper) 6px 12px);border:1px solid var(--rule)}
.it .y{font-size:10px;margin-top:2px;color:var(--ink2)}
.it .t{font-size:10px;line-height:1.2;max-height:24px;overflow:hidden}
.chip{position:absolute;display:flex;gap:6px;align-items:center;height:30px;padding-right:8px;background:var(--paper);border:1px solid var(--rule);cursor:pointer;white-space:nowrap;font-size:11px}
.chip .th{width:28px;height:28px}
.chip b{font-weight:500}
.chip span{color:var(--ink2)}
.ev{position:absolute;font-size:11px;white-space:nowrap;padding-left:8px;border-left:2px solid var(--ink);cursor:pointer;line-height:1.25}
.ev span{color:var(--blue);font-weight:600;margin-right:6px}

/* карточка */
#card{position:fixed;top:0;right:0;width:min(460px,100vw);height:100vh;background:var(--paper);border-left:1px solid var(--ink);transform:translateX(100%);transition:transform .25s;z-index:30;overflow-y:auto}
#card.on{transform:none}
.c-top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.08em;position:sticky;top:0;background:var(--paper)}
.c-top button{border:1px solid var(--ink);background:none;padding:4px 10px;font-size:11px;margin-left:6px}
.c-top button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.c-img{aspect-ratio:4/3;background:var(--paper2);border-bottom:1px solid var(--ink)}
.c-img img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.c-img.none{display:grid;place-items:center;padding:24px;text-align:center;font-size:11px;color:var(--ink2);background:repeating-linear-gradient(45deg,var(--paper2) 0 8px,var(--paper) 8px 16px)}
.c-credit{font-size:10px;color:var(--ink2);padding:6px 24px;border-bottom:1px solid var(--rule)}
.c-body{padding:20px 24px 40px}
.c-kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:600}
.c-title{font:600 26px/1.1 var(--head);margin:8px 0 6px}
.c-years{font:600 40px/1 var(--head);color:var(--blue);margin:14px 0 4px;letter-spacing:-.02em}
.c-src{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:20px 0;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
dt{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
dd{margin:0}
.lnk{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.c-p{font-size:13px;line-height:1.6;margin:0 0 14px}
ul.feat{list-style:none;padding:0;margin:0 0 16px}
ul.feat li{padding:6px 0;border-bottom:1px dashed var(--rule)}
ul.feat li::before{content:"— ";color:var(--blue)}
.orn{display:flex;gap:4px;align-items:center;font-size:10px;text-transform:uppercase;color:var(--ink2);margin:16px 0}
.orn i{width:22px;height:8px;border:1px solid var(--ink)}
.orn i.on{background:var(--ink)}
.refs{margin-top:20px;font-size:11px}
.refs a{display:inline-block;margin:0 10px 6px 0}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.wk .th{width:100%;height:auto;aspect-ratio:1}
.wk div{cursor:pointer;font-size:10px;line-height:1.2}

/* кадр 4:5 */
#poster{position:fixed;inset:0;background:rgba(28,28,28,.85);display:none;place-items:center;z-index:40}
#poster.on{display:grid}
.pst{width:540px;height:675px;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto auto;padding:28px;gap:16px;position:relative}
.pst .ph{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--ink);padding-bottom:10px}
.pst .ph b{color:var(--blue)}
.pst .pi{overflow:hidden;background:#fff;display:grid;place-items:center}
.pst .pi img{width:100%;height:100%;object-fit:cover}
.pst h2{font:800 30px/1.02 var(--head);margin:0;text-transform:uppercase;letter-spacing:-.01em}
.pst .pm{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;border-top:1px solid var(--ink);padding-top:12px}
.pst .py{font:800 54px/0.8 var(--head);color:var(--blue);letter-spacing:-.03em}
.pst .pw{font-size:12px;line-height:1.45}
 @media (max-width:600px){
  header{grid-template-columns:1fr;padding:20px 16px 16px} h1{font-size:30px} .stats{gap:16px} .stat b{font-size:20px}
  nav{padding:6px 10px} nav .row{flex-wrap:nowrap;overflow-x:auto} .lab em{display:none} #tl{height:calc(100vh - 70px)}
  .c-top,.c-body{padding-left:16px;padding-right:16px} .c-credit{padding:6px 16px}
  .pst{width:100vw;height:125vw;padding:14px;gap:10px} .pst h2{font-size:20px} .pst .py{font-size:36px} .pst .pw{font-size:10px}
}
.pst-close{position:absolute;top:20px;right:20px;color:#fff;background:none;border:1px solid #fff;padding:6px 12px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <!-- дуотон: тени графит → полутона синий → света бумага -->
  <filter id="duo" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values=".3 .59 .11 0 0  .3 .59 .11 0 0  .3 .59 .11 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.11 0.227 0.957"/>
      <feFuncG type="table" tableValues="0.11 0.243 0.945"/>
      <feFuncB type="table" tableValues="0.11 0.847 0.918"/>
    </feComponentTransfer>
  </filter>
</svg>

<header>
  <h1>История<br>дизайна<small>1830 — 2020 · таймлайн-шпаргалка · Структорум</small></h1>
  <div class="stats" id="stats"></div>
</header>
<nav id="nav"><div class="row" id="tracks"></div><div class="row" id="zoom"></div></nav>
<div id="tl"><div id="canvas"></div></div>

<aside id="card"></aside>
<div id="poster"><button class="pst-close" onclick="poster.classList.remove('on')">Закрыть</button><div class="pst" id="pst"></div></div>

<script src="../data.js"></script>
<script>
const DB = window.DB, $ = s => document.querySelector(s);
const byId = {}; for (const k of ['movements','people','works']) for (const e of DB[k]) byId[e.id] = Object.assign(e, {_k:k});
const nameOf = id => byId[id] ? (byId[id].name || byId[id].title) : id;

/* дорожки: ключ, название, подпись, цвет */
const LANES = [
  ['styles', 'Маятник стилей', 'стиль выше — больше декора, ниже — проще', null],
  ['line', 'Линия маятника', 'куда качалась мода по десятилетиям', 'var(--orange)'],
  ['chairs', 'Стулья', 'ключевые стулья по годам', 'var(--orange)'],
  ['materials', 'Материалы и технологии', 'гнутое дерево, сталь, пластик…', 'var(--yellow)'],
  ['for-all', 'Массовый дизайн', 'вещи для всех: серия, цена, доступность', 'var(--mint)'],
  ['schools', 'Школы и выставки', 'мастерские, школы, выставки, объединения', 'var(--lilac)'],
  ['russia', 'Дизайн в России', 'от неорусского стиля до ВХУТЕМАСа', 'var(--blue)'],
  ['eco', 'Экодизайн', 'ресурсы, переработка, долговечность', 'var(--mint)'],
];
const store = {get(k, d) { try { const v = JSON.parse(localStorage.getItem('dh_' + k)); return v ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem('dh_' + k, JSON.stringify(v)) } catch {} }};
const ZOOMS = [8, 14, 24, 36];
let PX = store.get('px', 24), hidden = new Set(store.get('hidden', []));
const Y0 = 1825, Y1 = 2025, L = 40;
const X = y => L + (Math.max(y, Y0) - Y0) * PX;
let W = 0;

/* картинка: img_file из базы или site/img/<id>.jpg|png, иначе штриховка */
function img(e, cls = 'th', duo = true) {
  const d = document.createElement('div'); d.className = cls;
  const src = e.img_file ? ['../' + e.img_file] : ['../img/' + e.id + '.jpg', '../img/' + e.id + '.png'];
  const im = new Image(); let i = 0; im.loading = 'lazy'; im.alt = ''; im.draggable = false;
  if (!duo) im.style.filter = 'none';
  im.onerror = () => { if (++i < src.length) im.src = src[i]; else { im.remove(); d.classList.add('none'); } };
  im.src = src[0]; d.appendChild(im); return d;
}

/* упаковка по строкам */
function pack(items, gap = 8) {
  const ends = [];
  for (const it of items.sort((a, b) => a.x0 - b.x0)) {
    let r = ends.findIndex(e => e + gap <= it.x0); if (r < 0) { r = ends.length; ends.push(0); }
    ends[r] = it.x1; it.row = r;
  }
  return ends.length;
}
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const HEAD = 46; // место под название дорожки

function render() {
  const canvas = $('#canvas'); canvas.innerHTML = ''; W = X(Y1) + 80; canvas.style.width = W + 'px';
  /* линейка */
  const ruler = document.createElement('div'); ruler.className = 'ruler'; canvas.appendChild(ruler);
  const step = PX < 12 ? 10 : 5;
  for (let y = 1830; y <= 2020; y += step) {
    const t = document.createElement('div'); const major = y % (PX < 12 ? 20 : 10) == 0;
    t.className = 'tick' + (major ? '' : ' minor'); t.style.left = X(y) + 'px'; t.textContent = y; ruler.appendChild(t);
    if (major) { const g = document.createElement('div'); g.className = 'grid'; g.style.left = X(y) + 'px'; canvas.appendChild(g); }
  }
  function lane(key, h, legend = '') {
    const [, title, sub, color] = LANES.find(l => l[0] == key);
    const l = document.createElement('div'); l.className = 'lane'; l.style.height = (h + HEAD) + 'px'; l.style.width = W + 'px';
    l.innerHTML = `<div class="lab">${color ? `<i style="background:${color}"></i>` : ''}<b>${title}</b><em>${sub}${legend}</em><button title="Скрыть дорожку" onclick="toggle('${key}')">скрыть</button></div>`;
    const body = document.createElement('div'); body.className = 'body'; body.style.top = HEAD + 'px'; l.appendChild(body);
    canvas.appendChild(l); return body;
  }

  /* 1. маятник стилей */
  if (!hidden.has('styles')) {
    const ms = DB.movements.map(m => ({m, x0: X(m.start), x1: Math.max(X(m.end || m.start + 12), X(m.start) + 40)}));
    const lv = {}; ms.forEach(o => (lv[o.m.ornament] = lv[o.m.ornament] || []).push(o));
    const rows = {}; for (const k in lv) rows[k] = pack(lv[k], 4);
    const RH = 28, levels = [2, 1, 0, -1, -2], NAMES = {2: 'много декора', 1: 'декор', 0: 'середина', '-1': 'проще', '-2': 'минимум'};
    let y = 8; const top = {};
    for (const k of levels) { top[k] = y; y += Math.max(rows[k] || 1, 1) * RH + 12; }
    const showLine = !hidden.has('line');
    const l = lane('styles', y, showLine ? ' · <span style="color:var(--orange)">━ средний уровень декора по десятилетиям</span>' : '');
    const mid = top[0] + RH / 2;
    for (const k of levels) {
      const b = document.createElement('div'); b.className = 'band' + (k < 0 ? ' s' : ''); b.style.top = (top[k] - 6) + 'px';
      b.style.height = (Math.max(rows[k] || 1, 1) * RH + 12) + 'px'; b.innerHTML = `<span>${k > 0 ? '↑' : k < 0 ? '↓' : '·'} ${NAMES[k]}</span>`; l.appendChild(b);
    }
    for (const o of ms) {
      const d = document.createElement('div'), orn = o.m.ornament;
      d.className = 'mv' + (orn < 0 ? ' simple' : orn == 0 ? ' mid' : '') + (o.m.end ? '' : ' open-end');
      d.style.left = o.x0 + 'px'; d.style.width = (o.x1 - o.x0) + 'px'; d.style.top = (top[orn] + o.row * RH) + 'px';
      d.textContent = o.m.name; d.title = `${o.m.name} ${o.m.start}–${o.m.end || '…'}`; d.onclick = () => open(o.m.id); l.appendChild(d);
    }
    if (showLine) {
      const pts = [];
      for (let dec = 1830; dec <= 2010; dec += 10) {
        const act = DB.movements.filter(m => m.start <= dec + 9 && (m.end || m.start + 12) >= dec);
        if (!act.length) continue;
        const avg = act.reduce((s, m) => s + m.ornament, 0) / act.length;
        pts.push([X(dec + 5), mid - avg * (top[0] - top[1]), dec, avg, act.length]);
      }
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('pend');
      svg.setAttribute('width', W); svg.setAttribute('height', y);
      const p = pts.map((q, i) => (i ? 'L' : 'M') + q[0] + ' ' + q[1]).join(' ');
      svg.innerHTML = `<path d="${p}" fill="none" stroke="#F2642A" stroke-width="2.5" stroke-linejoin="round"/>` +
        pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#F2642A"><title>${q[2]}-е: ${q[3] > 0.3 ? 'больше декора' : q[3] < -0.3 ? 'проще' : 'середина'} (среднее по ${q[4]} стилям: ${q[3].toFixed(1)})</title></circle>`).join('');
      l.appendChild(svg);
    }
  }

  /* 2. стулья — картинки */
  if (!hidden.has('chairs')) {
    const T = PX >= 24 ? 64 : 44, big = PX >= 24;
    const ws = DB.works.filter(w => w.tracks.includes('chairs') && w.year).map(w => ({w, x0: X(w.year) - T / 2, x1: X(w.year) + T / 2 + (big ? 4 : 0)}));
    const RH = big ? 104 : T + 20, n = pack(ws, 6), l = lane('chairs', 6 + n * RH);
    for (const o of ws) {
      const d = document.createElement('div'); d.className = 'it'; d.style.width = T + 'px'; d.style.left = o.x0 + 'px'; d.style.top = (4 + o.row * RH) + 'px';
      const th = img(o.w); th.style.width = th.style.height = T + 'px'; d.appendChild(th);
      d.insertAdjacentHTML('beforeend', `<div class="y">${o.w.year}</div>${big ? `<div class="t">${o.w.title}</div>` : ''}`);
      d.title = `${o.w.year} · ${o.w.title}`; d.onclick = () => open(o.w.id); l.appendChild(d);
    }
  }

  /* 3. остальные дорожки — фишки */
  const used = new Set(), N = PX >= 24 ? 26 : PX >= 14 ? 16 : 0;
  for (const k of ['materials', 'for-all', 'schools', 'russia', 'eco']) {
    const items = [];
    for (const w of DB.works) {
      if (!w.year || used.has(w.id) || w.tracks.includes('chairs') || !w.tracks.includes(k)) continue;
      used.add(w.id); if (hidden.has(k)) continue;
      const x = X(w.year); items.push({w, x0: x, x1: x + 38 + Math.min(w.title.length, N) * 6.6});
    }
    if (hidden.has(k)) continue;
    for (const e of DB.events.filter(e => e.tracks[0] == k && e.year >= 1800)) {
      const x = X(e.year); items.push({e, x0: x, x1: x + 44 + Math.min(e.title.length, N + 10) * 6.6});
    }
    const RH = 36, n = pack(items, 8), l = lane(k, 4 + n * RH);
    for (const o of items) {
      if (o.w) {
        const d = document.createElement('div'); d.className = 'chip'; d.style.left = o.x0 + 'px'; d.style.top = (2 + o.row * RH) + 'px';
        d.appendChild(img(o.w)); d.insertAdjacentHTML('beforeend', `<span>${o.w.year}</span>${N ? `<b>${cut(o.w.title, N)}</b>` : ''}`);
        d.title = `${o.w.year} · ${o.w.title}`; d.onclick = () => open(o.w.id); l.appendChild(d);
      } else {
        const d = document.createElement('div'); d.className = 'ev'; d.style.left = o.x0 + 'px'; d.style.top = (4 + o.row * RH) + 'px';
        d.innerHTML = `<span>${o.e.year}</span>${cut(o.e.title, N + 10)}`; d.title = `${o.e.year} · ${o.e.title}`; d.onclick = () => openEv(o.e); l.appendChild(d);
      }
    }
  }
  if (hidden.size == LANES.length) canvas.insertAdjacentHTML('beforeend', '<p style="padding:40px">Все дорожки скрыты — включи нужные в панели сверху.</p>');
  drawNav();
}

/* панель: дорожки, масштаб, переход по годам */
function drawNav() {
  $('#tracks').innerHTML = '<span class="nl">Дорожки</span>' + LANES.map(([k, t, , c]) =>
    `<button class="tg${hidden.has(k) ? ' off' : ''}" onclick="toggle('${k}')"><i style="background:${c || 'var(--ink)'}"></i>${t}</button>`).join('') +
    (hidden.size ? `<button class="tg all" onclick="hidden.clear();save()">показать все</button>` : '');
  $('#zoom').innerHTML = '<span class="nl">Масштаб</span>' + ZOOMS.map((z, i) => `<button class="zm${z == PX ? ' on' : ''}" onclick="zoom(${z})">${['век', 'полвека', 'десятилетия', 'годы'][i]}</button>`).join('') +
    '<span class="nl" style="margin-left:16px">Перейти</span>' + [1850, 1900, 1925, 1950, 1975, 2000].map(y => `<button class="zm" onclick="go(${y})">${y}</button>`).join('');
}
function save() { store.set('hidden', [...hidden]); render(); }
function toggle(k) { hidden.has(k) ? hidden.delete(k) : hidden.add(k); save(); }
function centerYear() { const tl = $('#tl'); return Y0 + (tl.scrollLeft + tl.clientWidth / 2 - L) / PX; }
function go(y) { const tl = $('#tl'); tl.scrollTo({left: X(y) - tl.clientWidth / 3, behavior: 'smooth'}); }
function zoom(z) { const c = centerYear(), tl = $('#tl'); PX = z; store.set('px', z); render(); tl.scrollLeft = X(c) - tl.clientWidth / 2; }

/* перетаскивание мышью */
(() => {
  const tl = $('#tl'); let d = null;
  tl.addEventListener('mousedown', e => { if (e.button) return; d = {x: e.clientX, y: e.clientY, l: tl.scrollLeft, t: tl.scrollTop, m: false}; });
  addEventListener('mousemove', e => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { d.m = true; tl.classList.add('drag'); } if (d.m) { tl.scrollLeft = d.l - dx; tl.scrollTop = d.t - dy; } });
  addEventListener('mouseup', () => { if (d && d.m) setTimeout(() => tl.classList.remove('drag'), 0); d = null; });
  tl.addEventListener('click', e => { if (tl.classList.contains('drag')) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

render();
$('#stats').innerHTML = [[DB.movements.length, 'течений'], [DB.works.length, 'работ'], [DB.works.filter(w => w.tracks.includes('chairs')).length, 'стульев'], [DB.people.length, 'людей']]
  .map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('');

/* карточка */
const card = $('#card'), poster = $('#poster');
const link = id => byId[id] ? `<span class="lnk" onclick="open('${id}')">${nameOf(id)}</span>` : nameOf(id);
const SRC = {'лекция': 'дата из лекции', 'справка': 'дата не проверена', 'интернет': 'дата: Википедия'};
let cur = null;
function open(id) {
  const e = byId[id]; if (!e) return; cur = e; history.replaceState(null, '', '#' + id);
  const k = e._k, kind = k == 'movements' ? 'Течение' : k == 'people' ? (e.role || 'Человек') : (e.type || 'Работа');
  const yrs = k == 'movements' ? `${e.start}–${e.end || '…'}` : k == 'people' ? `${e.born || '?'}–${e.died || ''}` : (e.year || '—');
  let body = '';
  if (k == 'works') {
    body = `<dl>${e.author?.length ? `<dt>Автор</dt><dd>${e.author.map(link).join(', ')}</dd>` : ''}
      ${e.movement ? `<dt>Стиль</dt><dd>${link(e.movement)}</dd>` : ''}${e.place ? `<dt>Где</dt><dd>${e.place}</dd>` : ''}
      ${e.material?.length ? `<dt>Материал</dt><dd>${e.material.join(', ')}</dd>` : ''}</dl><p class="c-p">${e.why || ''}</p>`;
  } else if (k == 'movements') {
    body = `<div class="orn">простота ${[-2, -1, 0, 1, 2].map(v => `<i class="${v == e.ornament ? 'on' : ''}"></i>`).join('')} декор</div>
      <p class="c-p">${e.summary || ''}</p><ul class="feat">${(e.features || []).map(f => `<li>${f}</li>`).join('')}</ul>
      <dl>${e.where?.length ? `<dt>Где</dt><dd>${e.where.join(', ')}</dd>` : ''}${e.reaction_to ? `<dt>Ответ на</dt><dd>${link(e.reaction_to)}</dd>` : ''}
      ${e.people?.length ? `<dt>Люди</dt><dd>${e.people.map(link).join(', ')}</dd>` : ''}</dl>
      <div class="c-kind">Работы</div><div class="wk" id="wk"></div>`;
  } else {
    body = `<dl>${e.orig ? `<dt>Ориг.</dt><dd>${e.orig}</dd>` : ''}${e.country ? `<dt>Страна</dt><dd>${e.country}</dd>` : ''}
      ${e.movements?.length ? `<dt>Стиль</dt><dd>${e.movements.map(link).join(', ')}</dd>` : ''}</dl><p class="c-p">${e.fact || ''}</p>
      <div class="c-kind">Работы</div><div class="wk" id="wk"></div>`;
  }
  const wiki = [e.wiki_ru && `<a href="${e.wiki_ru}" target="_blank">Википедия RU</a>`, e.wiki_en && `<a href="${e.wiki_en}" target="_blank">Wikipedia EN</a>`].filter(Boolean).join('');
  const refs = (e.refs || []).map(r => `<a>Занятие ${r.lesson} · ${r.t}</a>`).join('');
  card.innerHTML = `<div class="c-top"><span>${k == 'movements' ? 'Стиль' : k == 'people' ? 'Персона' : 'Экспонат'} · ${e.id}</span>
    <span><button class="pri" onclick="openPoster()">Кадр 4:5</button><button onclick="card.classList.remove('on')">✕</button></span></div>
    <div id="cimg"></div>${e.img_credit ? `<div class="c-credit">Фото: ${e.img_credit}</div>` : ''}
    <div class="c-body"><div class="c-kind">${kind}</div><div class="c-title">${e.name || e.title}</div>
    <div class="c-years">${yrs}</div><div class="c-src">${SRC[e.year_src] || ''}${e.date_note ? ' · ' + e.date_note : ''}</div>
    ${body}<div class="refs">${wiki}</div><div class="refs" style="color:var(--ink2)">Звучало в лекции: ${refs}</div></div>`;
  const ci = img(e, 'c-img', false); ci.classList.toggle('c-img', true);
  if (k == 'movements' || k == 'people') {
    const ws = DB.works.filter(w => k == 'movements' ? w.movement == e.id || (e.works || []).includes(w.id) : (w.author || []).includes(e.id)).slice(0, 12);
    const wk = card.querySelector('#wk');
    for (const w of ws) { const d = document.createElement('div'); d.appendChild(img(w)); d.insertAdjacentHTML('beforeend', w.title); d.onclick = () => open(w.id); wk.appendChild(d); }
    if (!ws.length) wk.previousElementSibling.remove();
  }
  ci.querySelector('img')?.addEventListener('error', () => { if (ci.classList.contains('none')) ci.textContent = 'Картинки пока нет — сгенерим по промпту'; });
  card.querySelector('#cimg').replaceWith(ci); card.classList.add('on'); card.scrollTop = 0;
}
function openEv(e) {
  cur = {title: e.title, year: e.year, _k: 'events', why: ''};
  card.innerHTML = `<div class="c-top"><span>Событие</span><span><button onclick="card.classList.remove('on')">✕</button></span></div>
    <div class="c-body"><div class="c-kind">Событие</div><div class="c-years">${e.year}</div><div class="c-title">${e.title}</div>
    <div class="refs" style="color:var(--ink2)">Звучало в лекции: Занятие ${e.lesson} · ${e.t}</div></div>`;
  card.classList.add('on');
}
/* кадр для поста */
function openPoster() {
  const e = cur, k = e._k;
  const yr = k == 'movements' ? e.start : k == 'people' ? e.born : e.year;
  const sub = k == 'works' ? [(e.author || []).map(nameOf).join(', '), e.movement && nameOf(e.movement)].filter(Boolean).join(' · ') : k == 'movements' ? `${e.start}–${e.end || '…'} · ${(e.where || []).join(', ')}` : `${e.born || ''}–${e.died || ''} · ${e.country || ''}`;
  const txt = k == 'works' ? e.why : k == 'movements' ? (e.features || []).slice(0, 3).join(' · ') : e.fact || e.role;
  $('#pst').innerHTML = `<div class="ph"><span>История дизайна</span><b>${sub}</b></div><div class="pi" id="pimg"></div>
    <h2>${e.name || e.title}</h2><div class="pm"><div class="py">${yr || ''}</div><div class="pw">${txt || ''}</div></div>`;
  const pi = img(e, 'pi', false); $('#pimg').replaceWith(pi); poster.classList.add('on');
}
poster.onclick = ev => { if (ev.target === poster) poster.classList.remove('on'); };
document.addEventListener('keydown', ev => { if (ev.key == 'Escape') { poster.classList.remove('on'); card.classList.remove('on'); } });
/* ссылка на элемент: #id или #poster:id */
const h = decodeURIComponent(location.hash.slice(1));
if (h) { const id = h.replace(/^poster:/, ''); if (byId[id]) { open(id); go(byId[id].year || byId[id].start || byId[id].born || 1850); if (h.startsWith('poster:')) openPoster(); } }
</script>
</body>
</html>
