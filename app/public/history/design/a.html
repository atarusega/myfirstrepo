<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>История дизайна — периоды и стулья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EA; --paper2:#E9E4D8; --paper3:#DED8C9; --ink:#1C1C1C; --ink2:#6B685F; --rule:#D3CDBE;
  --blue:#3A3ED8; --orange:#F2642A; --mint:#9FE3D4; --lilac:#D9BDF2; --yellow:#F2B31A;
  --mono:'IBM Plex Mono',monospace; --head:'Unbounded',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--mono);overflow:hidden}
a{color:var(--blue)}
button{font:inherit;cursor:pointer;color:inherit}

/* шапка: одна строка */
header{display:flex;align-items:baseline;gap:28px;padding:18px 32px 14px;border-bottom:1px solid var(--ink)}
h1{font:800 26px/1 var(--head);margin:0;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
.sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.stats{display:flex;gap:22px;margin-left:auto}
.stat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.stat b{font:600 15px/1 var(--head);color:var(--ink);margin-right:5px}

/* панель */
nav{position:relative;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);padding:10px 32px;display:flex;flex-direction:column;gap:8px}
nav .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav .nl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin-right:4px}
.zm{border:1px solid var(--ink);background:var(--paper);padding:4px 11px;font-size:11px;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.zm.on{background:var(--ink);color:var(--paper)}
.zm:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.leg{display:inline-flex;gap:12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-left:18px}
.leg i{display:inline-block;width:14px;height:8px;vertical-align:middle;margin-right:4px;border:1px solid var(--ink)}
.leg i.d{background:var(--ink)} .leg i.m{background:var(--paper)} .leg i.s{background:var(--blue);border-color:var(--blue)}

/* обзор, эпоха, поиск */
#ov{position:relative;height:30px;flex:1;border:1px solid var(--ink);background:var(--paper2);cursor:pointer;overflow:hidden;touch-action:none}
.ov-y{position:absolute;top:0;font-size:9px;color:var(--ink2);padding-left:3px;border-left:1px solid var(--rule);height:100%}
.ov-m{position:absolute;height:2px;background:var(--ink)} .ov-m.s{background:var(--blue)}
.ov-c{position:absolute;bottom:2px;width:2px;height:5px;background:var(--orange)}
#ovf{position:absolute;top:0;bottom:0;border:2px solid var(--blue);background:rgba(58,62,216,.10);cursor:grab}
#era{margin-left:auto;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;color:var(--ink2)}
#era b{font:600 13px var(--head);color:var(--ink);margin-right:8px}
#q{border:1px solid var(--ink);background:#fff;font:inherit;font-size:11px;padding:4px 10px;width:230px;outline:0}
#q:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(58,62,216,.15)}
.srch{position:relative}
#res{position:absolute;top:calc(100% + 4px);left:0;width:380px;background:var(--paper);border:1px solid var(--ink);z-index:50;max-height:380px;overflow:auto;box-shadow:6px 6px 0 var(--paper3)}
#res:empty{display:none}
#res div{padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--rule);font-size:12px}
#res div:hover,#res div.on{background:var(--paper2)}
#res span{font-size:10px;text-transform:uppercase;color:var(--blue);margin-right:8px}
#res em{color:var(--ink2);font-style:normal;margin-left:6px}
.hl{outline:3px solid var(--orange)!important;outline-offset:3px;z-index:7!important}

/* таймлайн */
#tl{position:relative;overflow:auto;scrollbar-color:var(--ink) var(--paper2);cursor:grab}
#tl.drag{cursor:grabbing;user-select:none}
#canvas{position:relative;min-height:100%}
.ruler{position:sticky;top:0;height:34px;border-bottom:1px solid var(--ink);background:var(--paper);z-index:8}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--ink);font:600 11px var(--head);padding:11px 0 0 6px;letter-spacing:.02em}
.tick.minor{border-color:var(--rule);color:transparent;height:40%;top:auto;bottom:0}
.grid{position:absolute;top:34px;bottom:0;border-left:1px solid var(--rule);pointer-events:none}
.lane{position:relative;border-bottom:1px solid var(--ink)}
.lane .body{position:absolute;left:0;right:0;bottom:0}
.lab{position:sticky;left:0;top:34px;z-index:6;display:inline-flex;align-items:baseline;gap:10px;margin:0;padding:10px 16px 8px 32px;background:linear-gradient(90deg,var(--paper) 85%,transparent);white-space:nowrap;max-width:calc(100vw - 20px);pointer-events:none}
.lab b{font:800 13px/1 var(--head);text-transform:uppercase;letter-spacing:.04em}
.lab b::before{content:attr(data-n);color:var(--blue);margin-right:8px}
.lab em{font-style:normal;font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.lab .k{display:inline-block;width:12px;height:8px;border:1px solid var(--ink);margin:0 3px 0 8px;vertical-align:middle;background:var(--paper)} .lab .k.d2{background:var(--ink)} .lab .k.d1{box-shadow:inset 0 0 0 2px var(--ink)} .lab .k.s1{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)} .lab .k.s2{background:var(--blue);border-color:var(--blue)}
.dec{position:absolute;bottom:0;font:800 76px/.8 var(--head);letter-spacing:-.05em;color:var(--ink);opacity:.045;pointer-events:none;user-select:none}

/* периоды */
.mv{position:absolute;z-index:2;height:24px;display:flex;align-items:center;padding:0 9px;font:600 10.5px/1 var(--head);white-space:nowrap;overflow:hidden;cursor:pointer;border:1px solid var(--ink);background:var(--paper);transition:transform .12s,box-shadow .12s;letter-spacing:.01em}
.mv.d2{background:var(--ink);color:var(--paper)}
.mv.d1{background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink)}
.mv.s1{background:var(--paper);border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.mv.s2{background:var(--blue);border-color:var(--blue);color:#fff}
.mv.open-end{border-right:0;-webkit-mask:linear-gradient(90deg,#000 80%,transparent);mask:linear-gradient(90deg,#000 80%,transparent)}
.mv:hover,.mv.on{transform:translateY(-1px);box-shadow:3px 3px 0 var(--orange);z-index:5;border-color:var(--orange)}
.mv.off{opacity:.3}
.band{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.band span{position:sticky;left:32px;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);display:inline-block;padding:2px 0 0;opacity:.8}

/* стулья */
.it{position:absolute;cursor:pointer;width:64px;transition:opacity .15s}
.it.off{opacity:.25}
.th{width:64px;height:64px;background:var(--paper2);position:relative;overflow:hidden;transition:transform .15s}
.th img{width:100%;height:100%;object-fit:cover;filter:url(#duo);display:block;transition:filter .2s}
.it:hover .th,.it.on .th{transform:translateY(-2px);box-shadow:3px 3px 0 var(--orange)}
.it:hover .th img{filter:none}
.th.none{background:var(--paper2);border:1px solid var(--rule);display:flex;align-items:flex-end;padding:6px}
.th.none span{font:600 9px/1.2 var(--head);color:var(--ink2);overflow:hidden;max-height:100%}
.it .y{font:600 11px/1 var(--head);margin-top:6px}
.it .pin{position:absolute;top:-6px;width:1px;height:6px;background:var(--ink);opacity:.5}
.it .t{font-size:10px;line-height:1.25;max-height:26px;overflow:hidden;color:var(--ink2);margin-top:3px}

/* карточка */
#card{position:fixed;top:0;right:0;width:min(460px,100vw);height:100vh;background:var(--paper);border-left:1px solid var(--ink);transform:translateX(100%);transition:transform .25s;z-index:30;overflow-y:auto;box-shadow:-12px 0 32px rgba(28,28,28,.08)}
#card.on{transform:none}
.c-top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ink);font-size:10px;text-transform:uppercase;letter-spacing:.1em;position:sticky;top:0;background:var(--paper);z-index:2}
.c-top button{border:1px solid var(--ink);background:none;padding:5px 11px;font-size:11px;margin-left:6px;text-transform:none;letter-spacing:0}
.c-top button.pri{background:var(--ink);color:var(--paper)}
.c-top button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.c-img{aspect-ratio:4/3;background:var(--paper2);border-bottom:1px solid var(--ink)}
.c-img img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.c-img.none{display:grid;place-items:center;padding:24px;text-align:center;font-size:11px;color:var(--ink2);background:repeating-linear-gradient(45deg,var(--paper2) 0 8px,var(--paper) 8px 16px)}
.c-credit{font-size:10px;color:var(--ink2);padding:6px 24px;border-bottom:1px solid var(--rule)}
.c-body{padding:22px 24px 48px}
.c-kind{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:600}
.c-title{font:600 24px/1.12 var(--head);margin:8px 0 6px;letter-spacing:-.01em}
.c-years{font:800 44px/1 var(--head);margin:16px 0 4px;letter-spacing:-.03em}
.c-src{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
dl{display:grid;grid-template-columns:100px 1fr;gap:9px 12px;margin:20px 0;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
dt{color:var(--ink2);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
dd{margin:0}
.lnk{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.c-p{font-size:13px;line-height:1.65;margin:0 0 14px}
ul.feat{list-style:none;padding:0;margin:0 0 16px}
ul.feat li{padding:7px 0;border-bottom:1px dashed var(--rule)}
ul.feat li::before{content:"— ";color:var(--blue)}
.orn{display:flex;gap:4px;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:16px 0}
.orn i{width:22px;height:8px;border:1px solid var(--ink)}
.orn i.on{background:var(--ink)}
.refs{margin-top:20px;font-size:11px}
.refs a{display:inline-block;margin:0 10px 6px 0}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.wk .th{width:100%;height:auto;aspect-ratio:1}
.wk div{cursor:pointer;font-size:10px;line-height:1.2}
.wk div:hover .th img{filter:none}

/* кадр 4:5 */
#poster{position:fixed;inset:0;background:rgba(28,28,28,.88);display:none;place-items:center;z-index:40}
#poster.on{display:grid}
.pst{width:540px;height:675px;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto auto;padding:28px;gap:16px;position:relative}
.pst .ph{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--ink);padding-bottom:10px}
.pst .ph b{color:var(--blue)}
.pst .pi{overflow:hidden;background:#fff;display:grid;place-items:center}
.pst .pi img{width:100%;height:100%;object-fit:cover}
.pst h2{font:800 30px/1.02 var(--head);margin:0;text-transform:uppercase;letter-spacing:-.01em}
.pst .pm{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;border-top:1px solid var(--ink);padding-top:12px}
.pst .py{font:800 54px/0.8 var(--head);color:var(--blue);letter-spacing:-.03em}
.pst .pw{font-size:12px;line-height:1.45}
.pst-close{position:absolute;top:20px;right:20px;color:#fff;background:none;border:1px solid #fff;padding:6px 12px}
@media (max-width:600px){
  header{padding:14px 16px 12px;gap:12px;flex-wrap:wrap} h1{font-size:18px} .sub{display:none} .stats{gap:12px;margin-left:0;width:100%} .stat b{font-size:13px}
  nav{padding:8px 12px} nav .row{flex-wrap:nowrap;overflow-x:auto} .zm{white-space:nowrap;flex:none} #era{display:none} .leg{display:none} #q{width:150px} .lab{padding-left:16px} .lab em{display:none} .band span{left:16px}
  .c-top,.c-body{padding-left:16px;padding-right:16px} .c-credit{padding:6px 16px}
  .pst{width:100vw;height:125vw;padding:14px;gap:10px} .pst h2{font-size:20px} .pst .py{font-size:36px} .pst .pw{font-size:10px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <!-- дуотон: тени графит → полутона синий → света бумага -->
  <filter id="duo" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values=".3 .59 .11 0 0  .3 .59 .11 0 0  .3 .59 .11 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.11 0.227 0.957"/>
      <feFuncG type="table" tableValues="0.11 0.243 0.945"/>
      <feFuncB type="table" tableValues="0.11 0.847 0.918"/>
    </feComponentTransfer>
  </filter>
</svg>

<header>
  <h1>История дизайна</h1>
  <span class="sub">1830 — 2020 · периоды и стулья · Структорум</span>
  <div class="stats" id="stats"></div>
</header>
<nav id="nav">
  <div class="row"><span class="row" id="zoom"></span><button class="zm" onclick="fit()">вписать в экран</button>
    <span class="srch"><input id="q" placeholder="поиск: Баухаус, Панто, бук…" autocomplete="off"><div id="res"></div></span><span id="era"></span></div>
  <div class="row"><div id="ov" title="Вся история. Тяни рамку или кликни, чтобы перейти"></div></div>
</nav>
<div id="tl"><div id="canvas"></div></div>

<aside id="card"></aside>
<div id="poster"><button class="pst-close" onclick="poster.classList.remove('on')">Закрыть</button><div class="pst" id="pst"></div></div>

<script src="../data.js"></script>
<script>
const DB = window.DB, $ = s => document.querySelector(s);
const byId = {}; for (const k of ['movements','people','works']) for (const e of DB[k]) byId[e.id] = Object.assign(e, {_k:k});
const nameOf = id => byId[id] ? (byId[id].name || byId[id].title) : id;
const CHAIRS = DB.works.filter(w => w.tracks.includes('chairs') && w.year);

const store = {get(k, d) { try { const v = JSON.parse(localStorage.getItem('dh_' + k)); return v ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem('dh_' + k, JSON.stringify(v)) } catch {} }};
const ZOOMS = [8, 14, 24, 36];
let PX = store.get('px', 24);
const Y0 = 1825, Y1 = 2025, L = 40;
const X = y => L + (Math.max(y, Y0) - Y0) * PX;
let W = 0;

/* картинка: img_file из базы или site/img/<id>.jpg|png, иначе плашка с названием */
function img(e, cls = 'th', duo = true, label = '') {
  const d = document.createElement('div'); d.className = cls;
  const src = e.img_file ? ['../' + e.img_file] : ['../img/' + e.id + '.jpg', '../img/' + e.id + '.png'];
  const im = new Image(); let i = 0; im.loading = 'lazy'; im.alt = ''; im.draggable = false;
  if (!duo) im.style.filter = 'none';
  im.onerror = () => { if (++i < src.length) im.src = src[i]; else { im.remove(); d.classList.add('none'); if (label) d.innerHTML = `<span>${label}</span>`; } };
  im.src = src[0]; d.appendChild(im); return d;
}

/* упаковка по строкам */
function pack(items, gap = 8, slack = 0) {
  const ends = [];
  for (const it of items.sort((a, b) => a.x0 - b.x0)) {
    let r = ends.findIndex(e => e + gap <= it.x0 + slack); if (r < 0) { r = ends.length; ends.push(-1e9); }
    const dx = Math.max(0, ends[r] + gap - it.x0); it.x0 += dx; it.x1 += dx; it.dx = dx;
    ends[r] = it.x1; it.row = r;
  }
  return ends.length;
}
const HEAD = 40;

function render() {
  const canvas = $('#canvas'); canvas.innerHTML = ''; W = X(Y1) + 80; canvas.style.width = W + 'px';
  /* линейка */
  const ruler = document.createElement('div'); ruler.className = 'ruler'; canvas.appendChild(ruler);
  const step = PX < 12 ? 10 : 5, majorEvery = PX < 12 ? 20 : 10;
  for (let y = 1830; y <= 2020; y += step) {
    const t = document.createElement('div'); const major = y % majorEvery == 0;
    t.className = 'tick' + (major ? '' : ' minor'); t.style.left = X(y) + 'px'; t.textContent = y; ruler.appendChild(t);
    if (major) { const g = document.createElement('div'); g.className = 'grid'; g.style.left = X(y) + 'px'; canvas.appendChild(g); }
  }
  function lane(n, title, sub, h) {
    const l = document.createElement('div'); l.className = 'lane'; l.style.height = (h + HEAD) + 'px'; l.style.width = W + 'px';
    l.innerHTML = `<div class="lab"><b data-n="${n}">${title}</b><em>${sub}</em></div>`;
    const body = document.createElement('div'); body.className = 'body'; body.style.top = HEAD + 'px'; l.appendChild(body);
    canvas.appendChild(l); return body;
  }

  /* 01. периоды: цвет — уровень декора */
  {
    const ms = DB.movements.map(m => ({m, x0: X(m.start), x1: Math.max(X(m.end || m.start + 12), X(m.start) + 36)}));
    const RH = 27, n = pack(ms, 5), y = 12 + n * RH;
    const l = lane('01', 'Периоды', '<i class="k d2"></i>декор <i class="k d1"></i>умеренный <i class="k"></i>середина <i class="k s1"></i>проще <i class="k s2"></i>минимум · клик — карточка', y);
    const CL = {2: 'd2', 1: 'd1', 0: '', '-1': 's1', '-2': 's2'};
    for (const o of ms) {
      const d = document.createElement('div');
      d.className = 'mv ' + CL[o.m.ornament] + (o.m.end ? '' : ' open-end');
      d.style.left = o.x0 + 'px'; d.style.width = (o.x1 - o.x0) + 'px'; d.style.top = (6 + o.row * RH) + 'px';
      d.textContent = o.m.name; d.title = `${o.m.name} · ${o.m.start}–${o.m.end || '…'}`; d.dataset.id = o.m.id;
      d.onclick = () => open(o.m.id);
      d.onmouseenter = () => linkMv(o.m.id, true); d.onmouseleave = () => linkMv(o.m.id, false);
      l.appendChild(d);
    }
  }

  /* 02. стулья */
  {
    const T = PX >= 36 ? 88 : PX >= 24 ? 72 : PX >= 14 ? 56 : 40, big = PX >= 24;
    const ws = CHAIRS.map(w => ({w, x0: X(w.year) - T / 2, x1: X(w.year) + T / 2}));
    const RH = T + (big ? 46 : 20), n = pack(ws, 10, T * 0.9);
    const l = lane('02', 'Стулья', `${CHAIRS.length} ключевых стульев · наведи — цвет, клик — карточка`, 10 + n * RH + (PX >= 14 ? 40 : 0));
    const decStep = PX >= 24 ? 10 : 20;
    if (PX >= 14) for (let y = 1830; y <= 2020; y += decStep) l.insertAdjacentHTML('beforeend', `<div class="dec" style="left:${X(y) + 8}px">${y}</div>`);
    for (const o of ws) {
      const d = document.createElement('div'); d.className = 'it'; d.style.width = T + 'px'; d.style.left = o.x0 + 'px'; d.style.top = (10 + o.row * RH) + 'px';
      const th = img(o.w, 'th', true, o.w.title); th.style.width = th.style.height = T + 'px'; d.appendChild(th);
      if (o.dx > 2) d.insertAdjacentHTML('beforeend', `<i class="pin" style="left:${T / 2 - o.dx}px"></i>`);
      d.insertAdjacentHTML('beforeend', `<div class="y">${o.w.year}</div>${big ? `<div class="t">${o.w.title}</div>` : ''}`);
      d.title = `${o.w.year} · ${o.w.title}${o.w.movement ? ' · ' + nameOf(o.w.movement) : ''}`; d.dataset.id = o.w.id;
      d.onclick = () => open(o.w.id);
      d.onmouseenter = () => linkChair(o.w, true); d.onmouseleave = () => linkChair(o.w, false);
      l.appendChild(d);
    }
  }
  drawNav(); if (typeof syncOv == 'function' && $('#ovf')) syncOv();
}

/* связь: период ↔ стулья */
function linkMv(id, on) {
  for (const d of document.querySelectorAll('#canvas .it')) { const m = byId[d.dataset.id].movement; d.classList.toggle('off', on && m != id); d.classList.toggle('on', on && m == id); }
}
function linkChair(w, on) {
  if (!w.movement) return;
  const b = document.querySelector(`#canvas .mv[data-id="${w.movement}"]`); if (b) b.classList.toggle('on', on);
}

/* панель: масштаб */
function drawNav() {
  $('#zoom').innerHTML = '<span class="nl">Масштаб</span>' + ZOOMS.map((z, i) => `<button class="zm${z == PX ? ' on' : ''}" onclick="zoom(${z})">${['век', 'полвека', 'десятилетия', 'годы'][i]}</button>`).join('');
}
function centerYear() { const tl = $('#tl'); return Y0 + (tl.scrollLeft + tl.clientWidth / 2 - L) / PX; }
function go(y) { const tl = $('#tl'); tl.scrollTo({left: X(y) - tl.clientWidth / 3, behavior: 'smooth'}); }
function zoom(z) { const c = centerYear(), tl = $('#tl'); PX = z; store.set('px', z); render(); tl.scrollLeft = X(c) - tl.clientWidth / 2; }

/* перетаскивание мышью */
(() => {
  const tl = $('#tl'); let d = null;
  tl.addEventListener('mousedown', e => { if (e.button) return; d = {x: e.clientX, y: e.clientY, l: tl.scrollLeft, t: tl.scrollTop, m: false}; });
  addEventListener('mousemove', e => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { d.m = true; tl.classList.add('drag'); } if (d.m) { tl.scrollLeft = d.l - dx; tl.scrollTop = d.t - dy; } });
  addEventListener('mouseup', () => { if (d && d.m) setTimeout(() => tl.classList.remove('drag'), 0); d = null; });
  tl.addEventListener('click', e => { if (tl.classList.contains('drag')) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* полоса-обзор всей истории, подпись эпохи, «вписать», поиск */
const tl = $('#tl'), ov = $('#ov');
function drawOv() {
  const w = ov.clientWidth, OX = y => (Math.max(y, Y0) - Y0) / (Y1 - Y0) * w;
  let h = '';
  for (let y = 1850; y <= 2000; y += 25) h += `<span class="ov-y" style="left:${OX(y)}px">${y}</span>`;
  for (const m of DB.movements) h += `<i class="ov-m${m.ornament < 0 ? ' s' : ''}" style="left:${OX(m.start)}px;width:${Math.max(OX(m.end || m.start + 12) - OX(m.start), 2)}px;top:${11 + (2 - m.ornament) * 3}px"></i>`;
  for (const c of CHAIRS) h += `<b class="ov-c" style="left:${OX(c.year)}px"></b>`;
  ov.innerHTML = h + '<div id="ovf"></div>'; syncOv();
}
function syncOv() {
  const f = $('#ovf'); if (!f) return; const w = ov.clientWidth, k = w / (Y1 - Y0);
  const y0 = Y0 + (tl.scrollLeft - L) / PX, span = tl.clientWidth / PX;
  f.style.left = Math.max(0, (y0 - Y0) * k) + 'px'; f.style.width = Math.max(6, Math.min(w, span * k)) + 'px';
  const c = Math.round(centerYear()), act = DB.movements.filter(m => m.start <= c && (m.end || m.start + 12) >= c)
    .sort((a, b) => b.start - a.start).slice(0, 4).map(m => m.name);
  $('#era').innerHTML = `<b>${Math.floor(c / 10) * 10}-е</b>${act.join(', ')}`;
}
let raf = 0; tl.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(syncOv); });
(() => {
  let d = false;
  const to = cx => { const r = ov.getBoundingClientRect(); tl.scrollLeft = X(Y0 + (cx - r.left) / r.width * (Y1 - Y0)) - tl.clientWidth / 2; };
  ov.addEventListener('mousedown', e => { d = true; to(e.clientX); e.preventDefault(); e.stopPropagation(); });
  addEventListener('mousemove', e => { if (d) to(e.clientX); });
  addEventListener('mouseup', () => { d = false; });
  ov.addEventListener('touchstart', e => to(e.touches[0].clientX), {passive: true});
  ov.addEventListener('touchmove', e => { to(e.touches[0].clientX); e.preventDefault(); }, {passive: false});
})();
function fit() { PX = Math.max(3, (tl.clientWidth - L - 60) / (Y1 - Y0)); store.set('px', PX); render(); tl.scrollLeft = 0; }
function fitH() { tl.style.height = (innerHeight - $('header').offsetHeight - $('#nav').offsetHeight) + 'px'; }
addEventListener('resize', () => { fitH(); drawOv(); });

const q = $('#q'), res = $('#res'), ALL = [...DB.movements, ...DB.works, ...DB.people];
const KIND = {movements: 'период', works: 'работа', people: 'человек'};
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase(); if (s.length < 2) { res.innerHTML = ''; return; }
  const hit = ALL.filter(e => [e.name, e.title, e.orig, ...(e.aka || []), ...(e.material || [])].some(v => v && String(v).toLowerCase().includes(s))).slice(0, 12);
  res.innerHTML = hit.map((e, i) => `<div data-id="${e.id}" class="${i ? '' : 'on'}"><span>${KIND[e._k]}</span>${e.name || e.title}<em>${e.year || e.start || e.born || ''}</em></div>`).join('') || '<div>ничего не нашлось</div>';
});
res.addEventListener('click', e => { const it = e.target.closest('[data-id]'); if (!it) return; res.innerHTML = ''; q.value = ''; q.blur(); find(it.dataset.id); });
q.addEventListener('keydown', e => {
  if (e.key == 'Enter') res.querySelector('.on')?.click();
  if (e.key == 'Escape') { res.innerHTML = ''; q.blur(); }
  if (e.key == 'ArrowDown' || e.key == 'ArrowUp') { const a = [...res.querySelectorAll('[data-id]')], i = a.findIndex(x => x.classList.contains('on'));
    if (!a.length) return; a[i]?.classList.remove('on'); a[(i + (e.key == 'ArrowDown' ? 1 : a.length - 1)) % a.length].classList.add('on'); e.preventDefault(); }
});
function find(id) {
  const e = byId[id]; if (!e) return;
  const el = document.querySelector(`#canvas [data-id="${id}"]`);
  open(id);
  if (el) {
    const r = el.getBoundingClientRect(), t = tl.getBoundingClientRect();
    tl.scrollTo({left: tl.scrollLeft + r.left - t.left - (t.width - 460) / 2, top: tl.scrollTop + r.top - t.top - t.height / 3, behavior: 'smooth'});
    el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 3000);
  } else { const y = e.year || e.start || e.born; if (y) go(y); }
}
addEventListener('keydown', e => { if (e.key == '/' && document.activeElement != q) { q.focus(); e.preventDefault(); } });

render(); fitH(); drawOv();
$('#stats').innerHTML = [[DB.movements.length, 'периодов'], [CHAIRS.length, 'стула'], [DB.people.length, 'людей']]
  .map(([n, t]) => `<div class="stat"><b>${n}</b>${t}</div>`).join('');

/* карточка */
const card = $('#card'), poster = $('#poster');
const link = id => byId[id] ? `<span class="lnk" onclick="open('${id}')">${nameOf(id)}</span>` : nameOf(id);
const SRC = {'лекция': 'дата из лекции', 'справка': 'дата не проверена', 'интернет': 'дата: Википедия'};
let cur = null;
function open(id) {
  const e = byId[id]; if (!e) return; cur = e; history.replaceState(null, '', '#' + id);
  const k = e._k, kind = k == 'movements' ? 'Период' : k == 'people' ? (e.role || 'Человек') : (e.type || 'Работа');
  const yrs = k == 'movements' ? `${e.start}–${e.end || '…'}` : k == 'people' ? `${e.born || '?'}–${e.died || ''}` : (e.year || '—');
  let body = '';
  if (k == 'works') {
    body = `<dl>${e.author?.length ? `<dt>Автор</dt><dd>${e.author.map(link).join(', ')}</dd>` : ''}
      ${e.movement ? `<dt>Период</dt><dd>${link(e.movement)}</dd>` : ''}${e.place ? `<dt>Где</dt><dd>${e.place}</dd>` : ''}
      ${e.material?.length ? `<dt>Материал</dt><dd>${e.material.join(', ')}</dd>` : ''}</dl><p class="c-p">${e.why || ''}</p>`;
  } else if (k == 'movements') {
    body = `<div class="orn">простота ${[-2, -1, 0, 1, 2].map(v => `<i class="${v == e.ornament ? 'on' : ''}"></i>`).join('')} декор</div>
      <p class="c-p">${e.summary || ''}</p><ul class="feat">${(e.features || []).map(f => `<li>${f}</li>`).join('')}</ul>
      <dl>${e.where?.length ? `<dt>Где</dt><dd>${e.where.join(', ')}</dd>` : ''}${e.reaction_to ? `<dt>Ответ на</dt><dd>${link(e.reaction_to)}</dd>` : ''}
      ${e.people?.length ? `<dt>Люди</dt><dd>${e.people.map(link).join(', ')}</dd>` : ''}</dl>
      <div class="c-kind">Работы</div><div class="wk" id="wk"></div>`;
  } else {
    body = `<dl>${e.orig ? `<dt>Ориг.</dt><dd>${e.orig}</dd>` : ''}${e.country ? `<dt>Страна</dt><dd>${e.country}</dd>` : ''}
      ${e.movements?.length ? `<dt>Период</dt><dd>${e.movements.map(link).join(', ')}</dd>` : ''}</dl><p class="c-p">${e.fact || ''}</p>
      <div class="c-kind">Работы</div><div class="wk" id="wk"></div>`;
  }
  const wiki = [e.wiki_ru && `<a href="${e.wiki_ru}" target="_blank">Википедия RU</a>`, e.wiki_en && `<a href="${e.wiki_en}" target="_blank">Wikipedia EN</a>`].filter(Boolean).join('');
  const refs = (e.refs || []).map(r => `<a>Занятие ${r.lesson} · ${r.t}</a>`).join('');
  card.innerHTML = `<div class="c-top"><span>${k == 'movements' ? 'Период' : k == 'people' ? 'Персона' : 'Экспонат'}</span>
    <span><button class="pri" onclick="openPoster()">Кадр 4:5</button><button onclick="card.classList.remove('on')">✕</button></span></div>
    <div id="cimg"></div>${e.img_credit ? `<div class="c-credit">Фото: ${e.img_credit}</div>` : ''}
    <div class="c-body"><div class="c-kind">${kind}</div><div class="c-title">${e.name || e.title}</div>
    <div class="c-years">${yrs}</div><div class="c-src">${SRC[e.year_src] || ''}${e.date_note ? ' · ' + e.date_note : ''}</div>
    ${body}<div class="refs">${wiki}</div><div class="refs" style="color:var(--ink2)">Звучало в лекции: ${refs}</div></div>`;
  const ci = img(e, 'c-img', false); ci.classList.toggle('c-img', true);
  if (k == 'movements' || k == 'people') {
    const ws = DB.works.filter(w => k == 'movements' ? w.movement == e.id || (e.works || []).includes(w.id) : (w.author || []).includes(e.id)).slice(0, 12);
    const wk = card.querySelector('#wk');
    for (const w of ws) { const d = document.createElement('div'); d.appendChild(img(w, 'th', true, w.title)); d.insertAdjacentHTML('beforeend', w.title); d.onclick = () => open(w.id); wk.appendChild(d); }
    if (!ws.length) wk.previousElementSibling.remove();
  }
  ci.querySelector('img')?.addEventListener('error', () => { if (ci.classList.contains('none')) ci.textContent = 'Картинки пока нет — сгенерим по промпту'; });
  card.querySelector('#cimg').replaceWith(ci); card.classList.add('on'); card.scrollTop = 0;
}
/* кадр для поста */
function openPoster() {
  const e = cur, k = e._k;
  const yr = k == 'movements' ? e.start : k == 'people' ? e.born : e.year;
  const sub = k == 'works' ? [(e.author || []).map(nameOf).join(', '), e.movement && nameOf(e.movement)].filter(Boolean).join(' · ') : k == 'movements' ? `${e.start}–${e.end || '…'} · ${(e.where || []).join(', ')}` : `${e.born || ''}–${e.died || ''} · ${e.country || ''}`;
  const txt = k == 'works' ? e.why : k == 'movements' ? (e.features || []).slice(0, 3).join(' · ') : e.fact || e.role;
  $('#pst').innerHTML = `<div class="ph"><span>История дизайна</span><b>${sub}</b></div><div class="pi" id="pimg"></div>
    <h2>${e.name || e.title}</h2><div class="pm"><div class="py">${yr || ''}</div><div class="pw">${txt || ''}</div></div>`;
  const pi = img(e, 'pi', false); $('#pimg').replaceWith(pi); poster.classList.add('on');
}
poster.onclick = ev => { if (ev.target === poster) poster.classList.remove('on'); };
document.addEventListener('keydown', ev => { if (ev.key == 'Escape') { poster.classList.remove('on'); card.classList.remove('on'); } });
/* ссылка на элемент: #id или #poster:id */
const h = decodeURIComponent(location.hash.slice(1));
if (h) { const id = h.replace(/^poster:/, ''); if (byId[id]) { open(id); go(byId[id].year || byId[id].start || byId[id].born || 1850); if (h.startsWith('poster:')) openPoster(); } }
</script>
</body>
</html>
